# swarm-memory: confidential shared memory for multiplayer agents
# Tinfoil Container config. Must live in a PUBLIC repo (it is the verification recipe).
# For updates: edit this file, commit, run the Tinfoil Release workflow (e.g. v0.0.2).
#
# Two containers, one enclave, one H200:
#   memory-api  CPU. FastAPI + sqlite + local MiniLM embeddings. Receives all public traffic.
#   vllm        GPU. Qwen3.8-27B (bf16, ~54GB) via OpenAI-compatible API on :8001.
#   vllm-abl    GPU. Huihui Qwen3.8-27B abliterated (bf16, ~54GB) on :8002, same H200 (0.46 each).
#               NOT exposed through the shim: only memory-api can reach it, over
#               the closed `swarm` network. Answer synthesis never leaves the enclave.
cvm-version: 0.14.7
cpus: 16
memory: 65536
gpus: 1

models:
  # Generated by: tinfoil model wrap Qwen/Qwen3.8-27B --host iridium-1 --wait
  # FALLBACK (already wrapped): gpt-oss-20b, see tinfoil-config.gpt-oss-20b.yml
  - name: "qwen3.8-27b"
    repo: "Qwen/Qwen3.8-27B@37561816e66b5b9153b1b64c10968c18c1e6f4a0"
    mpk: "19a7de4e4830f339b7ab2dda942ecba90d37e1b0d63c6161987a444dc7a8f484_55586119680_ad99ce3c-c747-51b5-9811-dfa8e792d81c"
  # Generated by: tinfoil model wrap huihui-ai/Huihui-Qwen3.8-27B-abliterated --host iridium-1 --wait
  # Abliterated (refusal-direction removed) Qwen3.8-27B, apache-2.0, same architecture as the stock model.
  - name: "huihui-qwen3.8-27b-abliterated"
    repo: "huihui-ai/Huihui-Qwen3.8-27B-abliterated@739e3c5b89849f6c238ce1e5b70008612ae42cdd"
    mpk: "2696c66bc89419224cd4cd391b0c42d422eeec773c32216556c3c40c8f5d20b4_55586074624_6fbbf35c-9924-59fc-b9f7-1bcee15a1885"

networks:
  swarm: {}                 # closed: memory-api <-> vllm only, no internet
  stripe:                   # Track 01 ledger only: read-only Stripe charges
    egress: allowlist
    allow:
      - api.stripe.com

containers:
  - name: "memory-api"
    image: "ghcr.io/wakesync/hivemind@sha256:53324104ad8d0c4d628a9499344667a26d2aacd98e1fec62e819491866717c63"
    networks: [swarm, stripe]
    env:
      - LLM_BASE_URL: "http://vllm:8001/v1"
      - LLM_MODEL: "qwen3.8-27b"
      - LLM_TIMEOUT: "120"
      - MEMORY_BACKEND: "sqlite"
      - GRAPH_K: "2"
      - DB_PATH: "/data/swarm.db"
      # Qwen3.8-27B model card, non-thinking sampling (v0.1.0 forced temp .2 -> degenerate output)
      - LLM_TEMPERATURE: "0.7"
      - LLM_TOP_P: "0.8"
      - LLM_TOP_K: "20"
      - LLM_MIN_P: "0"
      - LLM_PRESENCE_PENALTY: "1.5"
      - LLM_REPETITION_PENALTY: "1.0"
      # POST /v1/generate: HMAC-gated stateless proxy to the closed vllm, one in flight
      - GENERATE_ENABLED: "1"
      - GEN_MAX_MESSAGES: "16"
      - GEN_MAX_PROMPT_CHARS: "16000"
      - GEN_MAX_TOKENS: "1024"
      # POST /v1/chat/completions (OpenAI-compatible, HMAC-gated, stateless): model id allowlist
      - ABL_BASE_URL: "http://vllm-abl:8002/v1"
      - ABL_MODEL: "qwen3.8-27b-abliterated"
      - CHAT_ENABLED: "1"
    secrets:
      - SWARM_SECRET        # shared HMAC secret for agent auth
      - STRIPE_KEY          # restricted read-only key (rk_...), or "none" for stub ledger
    tmpfs:
      /data: "size=512m,mode=1777"
      /tmp: "size=256m,mode=1777"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 2m

  - name: "vllm"
    image: "vllm/vllm-openai:qwen38@sha256:4a2f33a884222f7049b983263ad9976f89452bb81affecf5b67d89ad35c1bc31"
    runtime: nvidia
    gpus: all
    networks: [swarm]
    restart: always
    command: [
      "--model", "/tinfoil/mpk/mpk-19a7de4e4830f339b7ab2dda942ecba90d37e1b0d63c6161987a444dc7a8f484",
      "--served-model-name", "qwen3.8-27b",
      "--port", "8001",
      "--max-model-len", "32768",
      "--gpu-memory-utilization", "0.46",
      "--reasoning-parser", "qwen3",
      "--enforce-eager",
      "--dtype", "bfloat16",
      "--language-model-only"
    ]
    tmpfs:
      /tmp: "size=2g,mode=1777,exec"
      /root: "size=8g,mode=0700,exec"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      start_period: 30m

  # Abliterated engine. Same pinned qwen38 vLLM image, closed `swarm` network only, never exposed by the shim.
  # Waits for the stock engine to finish loading so the two don't race the GPU memory profiler.
  - name: "vllm-abl"
    image: "vllm/vllm-openai:qwen38@sha256:4a2f33a884222f7049b983263ad9976f89452bb81affecf5b67d89ad35c1bc31"
    runtime: nvidia
    gpus: all
    networks: [swarm]
    restart: always
    entrypoint: ["/bin/sh", "-c"]
    command: ["until curl -sf http://vllm:8001/health >/dev/null; do sleep 10; done; exec vllm serve /tinfoil/mpk/mpk-2696c66bc89419224cd4cd391b0c42d422eeec773c32216556c3c40c8f5d20b4 --served-model-name qwen3.8-27b-abliterated --port 8002 --max-model-len 32768 --gpu-memory-utilization 0.46 --reasoning-parser qwen3 --enforce-eager --dtype bfloat16 --language-model-only"]
    tmpfs:
      /tmp: "size=2g,mode=1777,exec"
      /root: "size=8g,mode=0700,exec"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8002/health"]
      interval: 30s
      timeout: 5s
      start_period: 60m

shim:
  upstream-container: "memory-api"
  upstream-port: 8080
  paths:
    - /*                  # everything goes to memory-api; vllm is never exposed
