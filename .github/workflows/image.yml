# Build + push the memory-api image to GHCR and print the digest to pin in
# tinfoil/tinfoil-config.yml. Run: gh workflow run image.yml -f tag=v0.1.0
name: Build image
on:
  workflow_dispatch:
    inputs:
      tag:
        description: image tag
        required: true
        default: v0.1.0
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/${{ github.repository_owner }}/hivemind:${{ inputs.tag }}
      - run: echo "PIN THIS -> ghcr.io/${{ github.repository_owner }}/swarm-memory@${{ steps.push.outputs.digest }}" | tee -a $GITHUB_STEP_SUMMARY
